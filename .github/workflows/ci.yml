# Continuous integration: static checks and the API security tests first, then ZAP baseline and full scans of
# both builds in parallel, then one job that judges all four reports together.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, without a code change: a broken dependency or a change outside the repository
    # shows up within a week (night in India, before the daily Quality Intelligence collection)
    - cron: '15 23 * * 4' # Thursday 23:15 UTC
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, format, API security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # The same tests as npm test, also written as JUnit XML (reports/ is not in the repository)
      - run: mkdir -p reports && npm run test:ci
      # JUnit XML only, as its own artifact: the CI results collection of
      # automation-coverage-quality-intelligence imports it (config/producers.toml there)
      - name: Keep the JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-api
          path: reports/junit-api.xml
          if-no-files-found: warn
          retention-days: 30

  scan:
    name: ZAP scans (${{ matrix.build }} build)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        build: [hardened, vulnerable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The app and ZAP run in containers on a private Docker network (scripts/scan.ts); no npm packages needed.
      - name: Baseline and full scan
        run: node scripts/scan.ts --full --build ${{ matrix.build }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: zap-${{ matrix.build }}
          path: reports/zap/${{ matrix.build }}-*
          retention-days: 14

  verify:
    name: Judge the reports
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: zap-*
          path: reports/zap
          merge-multiple: true
      # Hardened: only IGNORE alerts allowed. Vulnerable: every planted defect reported. Summary on the run page.
      - run: node scripts/verify.ts --full
